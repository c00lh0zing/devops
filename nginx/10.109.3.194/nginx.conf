load_module /opt/syngx/modules/ngx_http_stream_server_traffic_status_module.so;
load_module /opt/syngx/modules/ngx_stream_server_traffic_status_module.so;
load_module /opt/syngx/modules/ngx_hashicorp_vault_module.so;

user syngx;
worker_processes auto;
worker_rlimit_nofile 128000;

error_log /opt/syngx/logs/error.log;
pid /opt/syngx/logs/syngx.pid;

events {
   worker_connections 8192;
}

http {
   upstream ekts-a-prom-prov.omega.sbrf.ru {
     server 10.119.121.44:443;
     server 10.109.37.176:443;
   }
   upstream provisioning_http {
     server 10.119.121.44:80;
     server 10.109.37.176:80;
   }
   upstream provisioning-unify-config-generator {
    server 10.119.121.44:18443;
    server 10.109.37.176:18443;
   }
   real_ip_header X-Forwarded-For;
   set_real_ip_from 0.0.0.0/0;

   include mime.types;
   default_type application/octet-stream;
   keepalive_timeout 65;

   variables_hash_bucket_size 64;
   variables_hash_max_size 4096;
   client_body_buffer_size 16k;
   client_header_buffer_size 1k;
   client_max_body_size 16M;
   large_client_header_buffers 4 8k;

   ssl_stapling on;
   server_tokens off;
   ssl_stapling_verify on;
   ssl_session_tickets off;
   ssl_prefer_server_ciphers on;
   #ssl_certificate /opt/syngx/ssl/server.pem;
   #ssl_certificate_key /opt/syngx/ssl/server.key;
   ssl_protocols TLSv1.3;
   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
   ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;


   add_header Allow "GET, POST, HEAD" always;
   add_header X-Frame-Options SAMEORIGIN;
   add_header X-XSS-Protection "1;mode=block";
   add_header X-Content-Type-Options nosniff;
   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
   proxy_hide_header X-Powered-By;

      log_format csp '$remote_addr - $remote_user [$time_local] "$host" "$hostname" "$server_addr" "$server_name" "$server_port" "$request" '
'$status $body_bytes_sent "$http_referer" "$request_time" ' '"$http_user_agent" "$http_x_forwarded_for"';
   access_log syslog:server=10.109.27.17:7738,facility=local7,tag=syngx,severity=info csp;
   error_log syslog:server=10.109.27.17:7738;


   log_format main '$remote_addr - $remote_user [$time_local] "$request"'
     '$status $body_bytes_sent "$http_referer"'
     '"$http_user_agent" "$http_x_forwarded_for"';
   access_log /opt/syngx/logs/access.log main;

   #ZABBIX. Not uninstall.

     server {
        listen 80;
        server_name pvlow-tel000027.omega.sbrf.ru;
        if ( $request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE)$ ) {
        return 405;
        }
        location / {
            proxy_pass http://provisioning_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
     }

    server {
        listen 443 ssl;
        server_name pvlow-tel000027.omega.sbrf.ru;
        ssl_certificate /opt/syngx/ssl/pvlow-tel000027.cloud.omega.sbrf.ru.crt;
        ssl_certificate_key /opt/syngx/ssl/pvlow-tel000027.cloud.omega.sbrf.ru.key;
        ssl_protocols TLSv1.2;
        if ( $request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE)$ ) {
        return 405;
        }
        location /web {
            proxy_pass https://ekts-a-prom-prov.omega.sbrf.ru/web;
        }

        location / {
            proxy_pass https://ekts-a-prom-prov.omega.sbrf.ru;
            proxy_next_upstream error timeout http_404 http_500;
            proxy_ssl_certificate  /opt/syngx/ssl/pvlow-tel000027.omega.sbrf.ru.client.crt;
            proxy_ssl_certificate_key  /opt/syngx/ssl/pvlow-tel000027.omega.sbrf.ru.client.key;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_trusted_certificate /opt/syngx/ssl/rootCA.pem;
            proxy_ssl_verify off;
            proxy_ssl_verify_depth 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }


include /opt/syngx/conf.d/*.conf;

#status for zabbix. dont't uninstall!
include /opt/syngx/conf.d/syngx_status.conf;

}
